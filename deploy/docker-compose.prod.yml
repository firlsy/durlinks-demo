# Durlinks Go 版生产编排：PostgreSQL + Go 单容器双端口
# 用法：
#   1) 同目录建 .env：PG_PASSWORD=...、JWT_SECRET=...（可选 API_IMAGE）
#   2) docker compose -f docker-compose.prod.yml up -d
# 说明：
#   - Go 服务端直接渲染用户端/管理端，不需要 nginx 与静态站容器
#   - 对外只绑 127.0.0.1，公网入口交给反向代理（Nginx / Caddy / Lucky）
#   - 数据库与 JWT 走环境变量覆盖，迁移时无需改配置文件
name: durlinks

services:
  db:
    image: postgres:16-alpine
    container_name: durlinks-db
    environment:
      POSTGRES_DB: ${PG_DATABASE:-durlinks_demo}
      POSTGRES_USER: ${PG_USER:-durlinks_demo}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 .env 中设置 PG_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-durlinks_demo} -d ${PG_DATABASE:-durlinks_demo}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-durlinks-demo:latest}
    container_name: durlinks-demo-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DURLINKS_DB_PROVIDER: postgres
      DURLINKS_POSTGRES: "Host=db;Port=5432;Database=${PG_DATABASE:-durlinks_demo};Username=${PG_USER:-durlinks_demo};Password=${PG_PASSWORD}"
      DURLINKS_HOST: "0.0.0.0"
      DURLINKS_JWT_SECRET: "${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8789:8789"
      - "127.0.0.1:8788:8788"
    restart: unless-stopped

volumes:
  pgdata:
