# 容器内 nginx：托管两套 Blazor 静态站 + 按域名反代 API
# 若你在宿主已用 Lucky 反代，可不用本 nginx，直接用 Lucky 的 Web 服务子规则（见 lucky.md）

server {
    listen 80;
    server_name links.example.com;
    root /usr/share/nginx/user;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ { proxy_pass http://api:8789/; proxy_set_header Host $host; }
}

server {
    listen 80;
    server_name links-admin.example.com;
    root /usr/share/nginx/admin;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ { proxy_pass http://api:8788/; proxy_set_header Host $host; }
}
