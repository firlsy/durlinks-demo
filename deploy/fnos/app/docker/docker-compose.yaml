services:
  durlinks:
    # 由 build-fpk.sh 构建：基础镜像 + 两套静态站
    # 离线安装时先在 NAS 上 docker load 这个镜像
    image: durlinks-demo-api:1.8.26-fnos
    container_name: durlinks-demo-api
    network_mode: host
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Asia/Shanghai
    volumes:
      - ${TRIM_PKGVAR}/data:/app/data
      - ${TRIM_PKGVAR}/appsettings.Production.json:/app/appsettings.Production.json:ro
    restart: unless-stopped
