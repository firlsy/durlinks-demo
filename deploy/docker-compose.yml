# Durlinks Go 版本地/单机 Compose：SQLite 零依赖
# 用法：docker compose -f deploy/docker-compose.yml up -d --build
# 端口：8789 用户端（免登录） / 8788 管理端
name: durlinks

services:
  durlinks:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: durlinks
    environment:
      DURLINKS_HOST: "0.0.0.0"
      # 必填：JWT 密钥至少 32 位，占位符会被服务端拒绝
      DURLINKS_JWT_SECRET: "${JWT_SECRET:?请先 export JWT_SECRET=\"$(openssl rand -base64 48)\" 或写进 deploy/.env}"
      TZ: Asia/Shanghai
    volumes:
      - ../data:/app/data
    ports:
      - "8789:8789"
      - "8788:8788"
    restart: unless-stopped
