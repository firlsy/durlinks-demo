services:
  # PostgreSQL 数据库（服务器部署）
  db:
    image: postgres:16-alpine
    container_name: durlinks-db
    environment:
      POSTGRES_DB: durlinks
      POSTGRES_USER: durlinks
      POSTGRES_PASSWORD: ${PG_PASSWORD:-CHANGE_ME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durlinks -d durlinks"]
      interval: 10s
      retries: 5

  # 后端 API（用户端 8789 + 管理端 8788）
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: durlinks-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      Database__Provider: postgres
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=durlinks;Username=durlinks;Password=${PG_PASSWORD:-CHANGE_ME}"
      Kestrel__Host: "0.0.0.0"
      Jwt__Secret: "${JWT_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_DEPLOY}"
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    expose:
      - "8789"
      - "8788"

  # 网页前端 + 反代：Lucky 在宿主把 8080 的两个域名转到本容器
  # 这里用 nginx 托管 Blazor 静态文件并把 /api 反代到 api 容器
  web:
    image: nginx:alpine
    container_name: durlinks-web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../src/Durlinks.Web/bin/Release/net10.0/wwwroot:/usr/share/nginx/user:ro
      - ../src/Durlinks.AdminWeb/bin/Release/net10.0/wwwroot:/usr/share/nginx/admin:ro
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
