# Durlinks Go 版本地/单机 Compose：SQLite 零依赖
# 用法：docker compose -f deploy/docker-compose.yml up -d --build
# 端口：8789 用户端（免登录） / 8788 管理端
name: durlinks

services:
  durlinks:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: durlinks
    environment:
      DURLINKS_HOST: "0.0.0.0"
      DURLINKS_JWT_SECRET: "${JWT_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_DEPLOY}"
      TZ: Asia/Shanghai
    volumes:
      - ../data:/app/data
    ports:
      - "8789:8789"
      - "8788:8788"
    restart: unless-stopped
