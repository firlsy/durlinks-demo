<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>durlinks-demo · 管理控制台</title>
    <base href="/console/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="admin.css?v=1.8.26" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Durlinks.AdminWeb.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <style>
        /* 启动骨架：与真实控制台同构，让 WASM 初始化期间的等待视觉连续 */
        html, body { margin: 0; height: 100%; background: #f6f8fa;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
        .boot-shell { display: flex; height: 100vh; }
        .boot-side { width: 180px; flex: 0 0 180px; background: #1f2937; padding: 14px 0; }
        .boot-brand { display: flex; align-items: center; gap: 10px; padding: 0 16px 20px; }
        .boot-logo { width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,.14);
            display: flex; align-items: center; justify-content: center; color: #fff;
            font-size: 12px; font-weight: 700; letter-spacing: .5px; }
        .boot-nav { padding: 0 12px; display: flex; flex-direction: column; gap: 5px; }
        .boot-nav-item { height: 32px; border-radius: 7px; background: rgba(255,255,255,.05); }
        .boot-nav-item.on { background: rgba(255,255,255,.13); }
        .boot-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .boot-top { height: 56px; flex: 0 0 56px; background: #fff; border-bottom: 1px solid #eef0f3;
            display: flex; align-items: center; padding: 0 24px; }
        .boot-body { flex: 1; padding: 20px 24px; overflow: hidden; }
        .boot-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
        .boot-card { height: 80px; background: #fff; border: 1px solid #eef0f3; border-radius: 10px; }
        .boot-panels { display: grid; grid-template-columns: 1.45fr 1fr; gap: 14px; }
        .boot-panel { height: 236px; background: #fff; border: 1px solid #eef0f3; border-radius: 10px; }
        .sk { position: relative; overflow: hidden; background: #edf1f5; border-radius: 5px; }
        .sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
            animation: sk-shimmer 1.5s infinite; }
        @keyframes sk-shimmer { 100% { transform: translateX(100%); } }
        .sk-title { width: 92px; height: 13px; }
        .sk-line { height: 8px; }
        @media (max-width:820px) {
            .boot-side { display: none; }
            .boot-cards { grid-template-columns: repeat(2, 1fr); }
            .boot-panels { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="boot-shell">
            <aside class="boot-side">
                <div class="boot-brand">
                    <div class="boot-logo">DL</div>
                    <div style="flex:1">
                        <div class="sk sk-line" style="width:62px;background:rgba(255,255,255,.16);margin-bottom:6px"></div>
                        <div class="sk sk-line" style="width:44px;background:rgba(255,255,255,.08);height:6px"></div>
                    </div>
                </div>
                <nav class="boot-nav">
                    <div class="boot-nav-item on"></div>
                    <div class="boot-nav-item"></div>
                    <div class="boot-nav-item"></div>
                    <div class="boot-nav-item"></div>
                    <div class="boot-nav-item"></div>
                    <div class="boot-nav-item"></div>
                </nav>
            </aside>
            <main class="boot-main">
                <div class="boot-top"><div class="sk sk-title"></div></div>
                <div class="boot-body">
                    <div class="boot-cards">
                        <div class="boot-card"></div>
                        <div class="boot-card"></div>
                        <div class="boot-card"></div>
                        <div class="boot-card"></div>
                    </div>
                    <div class="boot-panels">
                        <div class="boot-panel"></div>
                        <div class="boot-panel"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- 带 JWT 的文件下载：用 fetch 拿二进制流直接触发保存，避免把整份文件经 base64 传进 .NET 内存 -->
    <script>
        window.durlinksDownloadAuthed = async function (url, fallbackName) {
            try {
                var token = localStorage.getItem('durlinks_token');
                var resp = await fetch(url, {
                    headers: token ? { 'Authorization': 'Bearer ' + token } : {}
                });
                if (!resp.ok) return 'HTTP ' + resp.status;
                var blob = await resp.blob();
                var name = fallbackName || 'download.xlsx';
                var cd = resp.headers.get('Content-Disposition') || '';
                var m = /filename\*=UTF-8''([^;]+)/i.exec(cd) || /filename="?([^";]+)"?/i.exec(cd);
                if (m) { try { name = decodeURIComponent(m[1]); } catch (e) { name = m[1]; } }
                var objUrl = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = objUrl; a.download = name;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(objUrl);
                return '';
            } catch (e) {
                return String(e);
            }
        };
        window.durlinksDownloadAuthedPost = async function (url, body, fallbackName) {
            try {
                var token = localStorage.getItem('durlinks_token');
                var resp = await fetch(url, {
                    method: 'POST',
                    headers: Object.assign({ 'Content-Type': 'application/json' },
                        token ? { 'Authorization': 'Bearer ' + token } : {}),
                    body: JSON.stringify(body || {})
                });
                if (!resp.ok) {
                    var text = await resp.text();
                    try { var j = JSON.parse(text); return j.message || ('HTTP ' + resp.status); }
                    catch (e) { return 'HTTP ' + resp.status; }
                }
                var blob = await resp.blob();
                var name = fallbackName || 'download.zip';
                var cd = resp.headers.get('Content-Disposition') || '';
                var m = /filename\*=UTF-8''([^;]+)/i.exec(cd) || /filename="?([^";]+)"?/i.exec(cd);
                if (m) { try { name = decodeURIComponent(m[1]); } catch (e) { name = m[1]; } }
                var objUrl = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = objUrl; a.download = name;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(objUrl);
                return '';
            } catch (e) {
                return String(e);
            }
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
